<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube-Style Media Player</title>
    <style>
        /* Base Dark Theme */
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            font-family: "Roboto", "Arial", sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .main-wrapper {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Upload Sections */
        .upload-container {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        .upload-zone {
            background: #272727;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            position: relative;
            flex: 1;
            transition: background 0.2s;
        }

        .upload-zone:hover {
            background: #333;
        }

        .upload-zone input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .upload-label {
            color: #aaa;
            font-size: 0.95rem;
            pointer-events: none;
        }
        .upload-label span { color: #3ea6ff; font-weight: 500; }

        /* --- AUTHENTIC YOUTUBE PLAYER UI --- */
        .yt-player {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            user-select: none; 
        }

        .yt-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
        }

        #currentTrackDisplay {
            font-size: 1.5rem;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            padding: 20px;
            text-align: center;
            word-break: break-word;
            z-index: 2;
        }

        /* The actual video element */
        #mediaPlayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none; /* Hidden until a video is played */
            z-index: 1;
        }

        .yt-controls-wrapper {
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 0 12px;
            box-sizing: border-box;
            opacity: 1;
            transition: opacity 0.3s;
            z-index: 5;
        }

        /* The Red Progress Bar */
        .yt-progress-container {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
            transition: height 0.1s ease;
        }

        .yt-progress-container:hover {
            height: 8px;
        }

        .yt-progress-bar {
            height: 100%;
            background: #ff0000;
            width: 0%;
            position: relative;
            pointer-events: none;
        }

        .yt-scrubber {
            position: absolute;
            right: -6.5px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 13px;
            height: 13px;
            background: #ff0000;
            border-radius: 50%;
            transition: transform 0.1s ease;
        }

        .yt-progress-container:hover .yt-scrubber,
        .yt-progress-container.dragging .yt-scrubber {
            transform: translateY(-50%) scale(1);
        }

        /* Controls Layout */
        .yt-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
        }

        .yt-left-controls, .yt-right-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .yt-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
        }

        .yt-btn:hover {
            opacity: 1;
        }

        .yt-time {
            font-size: 0.85rem;
            color: #ddd;
            font-variant-numeric: tabular-nums;
        }

        /* YouTube Settings Menu */
        .yt-settings-menu {
            position: absolute;
            bottom: 60px;
            right: 12px;
            background: rgba(28, 28, 28, 0.95);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            padding: 16px;
            width: 250px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .yt-settings-header {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .yt-settings-menu input[type="range"] {
            width: 100%;
            accent-color: #ff0000;
            cursor: pointer;
        }

        /* Playlist UI */
        .playlist-container {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .playlist-header {
            padding: 16px;
            font-size: 1rem;
            font-weight: 500;
            color: #f1f1f1;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #totalDurationDisplay {
            font-size: 0.85rem;
            color: #aaa;
            font-weight: 400;
        }

        #playlist { list-style: none; padding: 0; margin: 0; }

        .playlist-item {
            padding: 12px 16px;
            font-size: 0.95rem;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item:hover { background: #272727; }

        .playlist-item.active {
            color: #fff;
            background: #272727;
        }

        .playlist-item::before {
            content: '▶';
            font-size: 0.7rem;
            margin-right: 12px;
            color: #aaa;
            opacity: 0;
        }

        .playlist-item.active::before { opacity: 1; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #717171; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a0a0a0; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <div class="upload-container">
            <div class="upload-zone">
                <input type="file" id="audioUpload" multiple accept="audio/*">
                <div class="upload-label">Drag & drop <span>Audio</span> files<br><small>(Select multiple)</small></div>
            </div>
            <div class="upload-zone">
                <input type="file" id="videoUpload" multiple accept="video/*">
                <div class="upload-label">Drag & drop <span>Video</span> files<br><small>(Select multiple)</small></div>
            </div>
        </div>

        <div class="yt-player">
            <div class="yt-screen">
                <div id="currentTrackDisplay">No media selected</div>
                <video id="mediaPlayer" playsinline></video>
            </div>

            <div class="yt-settings-menu" id="settingsMenu">
                <div class="yt-settings-header">
                    <span>Playback speed</span>
                    <span id="speedValue">1.00x</span>
                </div>
                <input type="range" id="speedSlider" min="0.25" max="4.0" step="0.25" value="1.0">
            </div>

            <div class="yt-controls-wrapper">
                <div class="yt-progress-container" id="progressContainer">
                    <div class="yt-progress-bar" id="progressBar">
                        <div class="yt-scrubber"></div>
                    </div>
                </div>

                <div class="yt-controls-row">
                    <div class="yt-left-controls">
                        <button class="yt-btn" id="skipBackBtn" title="Skip back 10s">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                        </button>

                        <button class="yt-btn" id="playPauseBtn" title="Play/Pause">
                            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" width="28" height="28" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>

                        <button class="yt-btn" id="skipFwdBtn" title="Skip forward 10s">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                        </button>

                        <span class="yt-time" id="timeDisplay">0:00 / 0:00</span>
                    </div>

                    <div class="yt-right-controls">
                        <button class="yt-btn" id="settingsBtn" title="Settings">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M19.4 13c0-.3.1-.6.1-1s0-.7-.1-1l2.1-1.7c.2-.2.2-.4.1-.6l-2-3.5c-.1-.2-.3-.3-.5-.2l-2.5 1c-.5-.4-1.1-.7-1.7-1l-.4-2.7c0-.2-.2-.4-.4-.4H10c-.2 0-.4.2-.4.4l-.4 2.7c-.6.3-1.2.6-1.7 1l-2.5-1c-.2-.1-.5 0-.6.2l-2 3.5c-.1.2-.1.5.1.6L4.7 11c-.1.3-.1.6-.1 1s0 .7.1 1l-2.1 1.7c-.2.2-.2.4-.1.6l2 3.5c.1.2.3.3.5.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.7c0 .2.2.4.4.4h4c.2 0 .4-.2.4-.4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5c.1-.2.1-.5-.1-.6l-2.1-1.7zM12 15.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="playlist-container" id="playlistContainer">
            <div class="playlist-header">
                <span>Up next</span>
                <span id="totalDurationDisplay"></span>
            </div>
            <ul id="playlist"></ul>
        </div>

    </div>

    <script>
        const audioUpload = document.getElementById('audioUpload');
        const videoUpload = document.getElementById('videoUpload');
        const mediaPlayer = document.getElementById('mediaPlayer');
        const playlistContainer = document.getElementById('playlistContainer');
        const playlistElement = document.getElementById('playlist');
        const totalDurationDisplay = document.getElementById('totalDurationDisplay');
        
        // YT UI Elements
        const currentTrackDisplay = document.getElementById('currentTrackDisplay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const skipBackBtn = document.getElementById('skipBackBtn');
        const skipFwdBtn = document.getElementById('skipFwdBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        
        // Settings Menu
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsMenu = document.getElementById('settingsMenu');
        const speedSlider = document.getElementById('speedSlider');
        const speedValueDisplay = document.getElementById('speedValue');

        let tracks = [];
        let currentIndex = 0;
        let currentObjectUrl = null;
        let totalPlaylistSeconds = 0;
        let isDragging = false; 

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s}`;
            return `${m}:${s}`;
        }

        async function calculateTotalDuration(filesArray) {
            totalPlaylistSeconds = 0;
            totalDurationDisplay.textContent = "Calculating time...";

            let promises = filesArray.map(file => {
                return new Promise((resolve) => {
                    // Create an invisible tag to read the metadata
                    const tempMedia = document.createElement(file.type.startsWith('video/') ? 'video' : 'audio');
                    const objectUrl = URL.createObjectURL(file);
                    
                    tempMedia.onloadedmetadata = () => {
                        resolve(tempMedia.duration);
                        URL.revokeObjectURL(objectUrl); 
                    };
                    tempMedia.onerror = () => resolve(0);
                    tempMedia.src = objectUrl;
                });
            });

            const durations = await Promise.all(promises);
            totalPlaylistSeconds = durations.reduce((acc, curr) => acc + curr, 0);
            updateTotalDurationDisplay();
        }

        function updateTotalDurationDisplay() {
            if (totalPlaylistSeconds === 0) {
                totalDurationDisplay.textContent = "";
                return;
            }
            const speed = parseFloat(speedSlider.value);
            const adjustedSeconds = totalPlaylistSeconds / speed;
            
            if (speed === 1) {
                totalDurationDisplay.textContent = `Total time: ${formatTime(totalPlaylistSeconds)}`;
            } else {
                totalDurationDisplay.textContent = `Total time: ${formatTime(totalPlaylistSeconds)} (${formatTime(adjustedSeconds)} at ${speed}x)`;
            }
        }

        settingsBtn.addEventListener('click', () => {
            settingsMenu.style.display = settingsMenu.style.display === 'block' ? 'none' : 'block';
        });

        document.addEventListener('click', (e) => {
            if (!settingsBtn.contains(e.target) && !settingsMenu.contains(e.target)) {
                settingsMenu.style.display = 'none';
            }
        });

        speedSlider.addEventListener('input', function() {
            const currentSpeed = parseFloat(this.value);
            mediaPlayer.playbackRate = currentSpeed;
            speedValueDisplay.textContent = currentSpeed.toFixed(2) + 'x';
            updateTotalDurationDisplay(); 
        });

        playPauseBtn.addEventListener('click', () => {
            if (tracks.length === 0) return;
            if (mediaPlayer.paused) mediaPlayer.play();
            else mediaPlayer.pause();
        });

        skipBackBtn.addEventListener('click', () => {
            if (mediaPlayer.duration) mediaPlayer.currentTime = Math.max(0, mediaPlayer.currentTime - 10);
        });

        skipFwdBtn.addEventListener('click', () => {
            if (mediaPlayer.duration) mediaPlayer.currentTime = Math.min(mediaPlayer.duration, mediaPlayer.currentTime + 10);
        });

        mediaPlayer.addEventListener('play', () => {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        });

        mediaPlayer.addEventListener('pause', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        });

        mediaPlayer.addEventListener('timeupdate', () => {
            if (mediaPlayer.duration && !isDragging) {
                const percent = (mediaPlayer.currentTime / mediaPlayer.duration) * 100;
                progressBar.style.width = `${percent}%`;
                timeDisplay.textContent = `${formatTime(mediaPlayer.currentTime)} / ${formatTime(mediaPlayer.duration)}`;
            }
        });

        mediaPlayer.addEventListener('loadedmetadata', () => {
            timeDisplay.textContent = `0:00 / ${formatTime(mediaPlayer.duration)}`;
        });

        function updateProgressFromEvent(e) {
            if (!mediaPlayer.duration) return;
            const rect = progressContainer.getBoundingClientRect();
            let clickPosition = (e.clientX - rect.left) / rect.width;
            clickPosition = Math.max(0, Math.min(1, clickPosition)); 
            
            mediaPlayer.currentTime = clickPosition * mediaPlayer.duration;
            progressBar.style.width = `${clickPosition * 100}%`;
            timeDisplay.textContent = `${formatTime(mediaPlayer.currentTime)} / ${formatTime(mediaPlayer.duration)}`;
        }

        progressContainer.addEventListener('mousedown', (e) => {
            isDragging = true;
            progressContainer.classList.add('dragging');
            updateProgressFromEvent(e);
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) updateProgressFromEvent(e);
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                progressContainer.classList.remove('dragging');
            }
        });

        // Unified upload processor for both Audio and Video
        function processUpload(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            tracks = files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
            
            currentIndex = 0;
            renderPlaylist();
            playTrack(currentIndex);
            
            playlistContainer.style.display = 'block';
            calculateTotalDuration(tracks);
        }

        audioUpload.addEventListener('change', processUpload);
        videoUpload.addEventListener('change', processUpload);

        function renderPlaylist() {
            playlistElement.innerHTML = ''; 
            tracks.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'playlist-item';
                li.textContent = file.name;
                
                li.addEventListener('click', () => {
                    currentIndex = index;
                    playTrack(currentIndex);
                });
                
                playlistElement.appendChild(li);
            });
        }

        function playTrack(index) {
            if (index >= 0 && index < tracks.length) {
                const file = tracks[index];

                if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = URL.createObjectURL(file);
                
                mediaPlayer.src = currentObjectUrl;
                
                // Toggle UI based on file type
                if (file.type.startsWith('video/')) {
                    mediaPlayer.style.display = 'block';
                    currentTrackDisplay.style.display = 'none';
                } else {
                    mediaPlayer.style.display = 'none';
                    currentTrackDisplay.style.display = 'block';
                    currentTrackDisplay.textContent = file.name;
                }

                mediaPlayer.playbackRate = parseFloat(speedSlider.value);
                mediaPlayer.play();
                updateActiveTrackUI(index);
            }
        }

        mediaPlayer.addEventListener('ended', function() {
            currentIndex++;
            if (currentIndex < tracks.length) {
                playTrack(currentIndex);
            } else {
                updateActiveTrackUI(-1);
                currentTrackDisplay.style.display = 'block';
                currentTrackDisplay.textContent = "Playlist Complete";
                mediaPlayer.style.display = 'none';
                progressBar.style.width = "100%";
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        function updateActiveTrackUI(activeIndex) {
            const items = playlistElement.querySelectorAll('.playlist-item');
            items.forEach((item, index) => {
                if (index === activeIndex) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
